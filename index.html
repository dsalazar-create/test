<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Leader 360° Feedback Portal</title>
    
    <!-- React & React DOM CDN (Production Build) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel standalone for runtime JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Modern Keyframe Animations for Professional Feel */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .animate-fadeIn {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-scaleUp {
            animation: scaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-shake {
            animation: shake 0.2s ease-in-out 2;
        }

        /* Customize Scrollbars for clean dashboard views */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    
    <!-- Mount Root for React application -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // ==========================================
        // SYSTEM ICON ENGINE (Replaces lucide-react library)
        // ==========================================
        const Icon = ({ name, className = "w-4 h-4", ...props }) => {
            const icons = {
                shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>,
                users: (
                    <g>
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </g>
                ),
                bookopen: (
                    <g>
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
                    </g>
                ),
                clock: (
                    <g>
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </g>
                ),
                messagesquare: <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>,
                barchart2: (
                    <g>
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </g>
                ),
                send: (
                    <g>
                        <line x1="22" y1="2" x2="11" y2="13" />
                        <polygon points="22 2 15 22 11 13 2 9 22 2" />
                    </g>
                ),
                checkcircle: (
                    <g>
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </g>
                ),
                chevronright: <polyline points="9 18 15 12 9 6" />,
                chevronleft: <polyline points="15 18 9 12 15 6" />,
                plus: (
                    <g>
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </g>
                ),
                alertcircle: (
                    <g>
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </g>
                ),
                award: (
                    <g>
                        <circle cx="12" cy="8" r="7" />
                        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" />
                    </g>
                ),
                calendar: (
                    <g>
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                        <line x1="16" y1="2" x2="16" y2="6" />
                        <line x1="8" y1="2" x2="8" y2="6" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                    </g>
                ),
                sparkles: <path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-.877a.5.5 0 0 1 0-.972l6.135-.877A2 2 0 0 0 9.937 9.938l.877-6.135a.5.5 0 0 1 .972 0l.877 6.135a2 2 0 0 0 1.438 1.437l6.135.877a.5.5 0 0 1 0 .972l-6.135.877a2 2 0 0 0-1.438 1.438l-.877 6.135a.5.5 0 0 1-.972 0l-.877-6.135z" />,
                lock: (
                    <g>
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </g>
                ),
                unlock: (
                    <g>
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                    </g>
                ),
                heart: <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />,
                eye: (
                    <g>
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </g>
                ),
                eyeoff: (
                    <g>
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    </g>
                )
            };

            const path = icons[name.toLowerCase()] || <circle cx="12" cy="12" r="10" />;
            
            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                    {...props}
                >
                    {path}
                </svg>
            );
        };

        // ==========================================
        // INITIAL MOCK DATA
        // ==========================================
        const INITIAL_MANAGERS = [
            { id: 'mgr-1', name: 'Sarah Jenkins', team: 'Enterprise Sales East' },
            { id: 'mgr-2', name: 'Marcus Vance', team: 'Mid-Market Central' },
            { id: 'mgr-3', name: 'Elena Rostova', team: 'SDR Outbound Team' },
            { id: 'mgr-4', name: 'David Cho', team: 'Inbound Growth' }
        ];

        const INITIAL_FEEDBACK = [
            {
                id: 'f-1',
                managerId: 'mgr-1',
                timestamp: '2026-05-10T14:30:00Z',
                coachingRating: 5,
                coachingFrequency: 'Weekly',
                meetingsRating: 4,
                meetingsFrequency: 'Weekly',
                expertRating: 5,
                availableRating: 4,
                startFeedback: "Start sharing your closing scripts with the newer team members earlier in onboarding.",
                stopFeedback: "Stop rescheduling our 1-on-1s last minute; it breaks the momentum of the sales week.",
                continueFeedback: "Continue the deep-dive deal strategy sessions. They help me save slipping accounts."
            },
            {
                id: 'f-2',
                managerId: 'mgr-1',
                timestamp: '2026-05-12T09:15:00Z',
                coachingRating: 4,
                coachingFrequency: 'Bi-weekly',
                meetingsRating: 5,
                meetingsFrequency: 'Weekly',
                expertRating: 4,
                availableRating: 5,
                startFeedback: "Start doing more live-call shadowing. Real-time feedback is where I learn best.",
                stopFeedback: "Stop micro-managing the CRM update frequency as long as quotas are met.",
                continueFeedback: "Always being accessible when we have a hot prospect on a live line."
            },
            {
                id: 'f-3',
                managerId: 'mgr-2',
                timestamp: '2026-05-14T11:00:00Z',
                coachingRating: 2,
                coachingFrequency: 'Rarely',
                meetingsRating: 3,
                meetingsFrequency: 'Bi-weekly',
                expertRating: 3,
                availableRating: 2,
                startFeedback: "Start blocking out dedicated availability during high-volume calling hours.",
                stopFeedback: "Stop canceling our 1-on-1 coaching sessions. I feel left to figure things out on my own.",
                continueFeedback: "The pipeline reviews are helpful when we actually have them."
            },
            {
                id: 'f-4',
                managerId: 'mgr-2',
                timestamp: '2026-05-15T16:45:00Z',
                coachingRating: 3,
                coachingFrequency: 'Monthly',
                meetingsRating: 2,
                meetingsFrequency: 'Monthly',
                expertRating: 4,
                availableRating: 3,
                startFeedback: "Start hosting structured team syncs so we can share winning strategies.",
                stopFeedback: "Stop running meetings without a clear, sales-focused agenda.",
                continueFeedback: "Being very knowledgeable about contract terms and technical edge cases."
            },
            {
                id: 'f-5',
                managerId: 'mgr-3',
                timestamp: '2026-05-16T10:20:00Z',
                coachingRating: 5,
                coachingFrequency: 'Weekly',
                meetingsRating: 5,
                meetingsFrequency: 'Daily Huddles',
                expertRating: 5,
                availableRating: 5,
                startFeedback: "Start incorporating peer-to-peer roleplaying in our team huddles.",
                stopFeedback: "Nothing to stop! Keep up this incredible pace.",
                continueFeedback: "Providing hyper-specific feedback on our email outreach templates. My reply rate doubled."
            }
        ];

        // ==========================================
        // MAIN PORTAL APPLICATION
        // ==========================================
        function App() {
            // Navigation & Role States
            const [activeTab, setActiveTab] = useState('agent'); // 'agent' or 'dashboard'
            const [managers, setManagers] = useState(INITIAL_MANAGERS);
            const [feedbacks, setFeedbacks] = useState(INITIAL_FEEDBACK);

            // Security & Authentication Access States
            const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [enteredPasscode, setEnteredPasscode] = useState('');
            const [authError, setAuthError] = useState('');
            const [showPasscodeText, setShowPasscodeText] = useState(false);
            
            const MASTER_PASSCODE = "admin360";

            // Agent Form Flow States
            const [currentStep, setCurrentStep] = useState(1);
            const [selectedManagerId, setSelectedManagerId] = useState('');
            const [coachingRating, setCoachingRating] = useState(0);
            const [coachingFrequency, setCoachingFrequency] = useState('');
            const [meetingsRating, setMeetingsRating] = useState(0);
            const [meetingsFrequency, setMeetingsFrequency] = useState('');
            const [expertRating, setExpertRating] = useState(0);
            const [availableRating, setAvailableRating] = useState(0);
            const [startFeedback, setStartFeedback] = useState('');
            const [stopFeedback, setStopFeedback] = useState('');
            const [continueFeedback, setContinueFeedback] = useState('');
            const [isFormSubmitted, setIsFormSubmitted] = useState(false);

            // Dashboard Selector States
            const [dashboardManagerId, setDashboardManagerId] = useState(INITIAL_MANAGERS[0].id);
            const [newManagerName, setNewManagerName] = useState('');
            const [newManagerTeam, setNewManagerTeam] = useState('');
            const [showAddManagerModal, setShowAddManagerModal] = useState(false);

            // Secure Access Handlers
            const handleTabChange = (targetTab) => {
                if (targetTab === 'dashboard') {
                    if (isAdminAuthenticated) {
                        setActiveTab('dashboard');
                    } else {
                        setAuthError('');
                        setEnteredPasscode('');
                        setShowAuthModal(true);
                    }
                } else {
                    setActiveTab('agent');
                    setIsFormSubmitted(false);
                }
            };

            const handleAuthSubmit = (e) => {
                e.preventDefault();
                if (enteredPasscode.trim() === MASTER_PASSCODE) {
                    setIsAdminAuthenticated(true);
                    setShowAuthModal(false);
                    setAuthError('');
                    setEnteredPasscode('');
                    setActiveTab('dashboard');
                } else {
                    setAuthError('Access Denied. Incorrect administration passcode.');
                    setEnteredPasscode('');
                }
            };

            const handleLockDashboard = () => {
                setIsAdminAuthenticated(false);
                setActiveTab('agent');
                setIsFormSubmitted(false);
            };

            // Process New Review Submission
            const handleFeedbackSubmit = (e) => {
                e.preventDefault();
                if (!selectedManagerId || !coachingRating || !coachingFrequency || !meetingsRating || !meetingsFrequency || !expertRating || !availableRating) {
                    alert("Please fill out all ratings and frequency fields before submitting.");
                    return;
                }

                const newSubmission = {
                    id: `f-${Date.now()}`,
                    managerId: selectedManagerId,
                    timestamp: new Date().toISOString(),
                    coachingRating: Number(coachingRating),
                    coachingFrequency,
                    meetingsRating: Number(meetingsRating),
                    meetingsFrequency,
                    expertRating: Number(expertRating),
                    availableRating: Number(availableRating),
                    startFeedback: startFeedback.trim(),
                    stopFeedback: stopFeedback.trim(),
                    continueFeedback: continueFeedback.trim()
                };

                setFeedbacks([newSubmission, ...feedbacks]);
                setIsFormSubmitted(true);
                resetForm();
            };

            const resetForm = () => {
                setCoachingRating(0);
                setCoachingFrequency('');
                setMeetingsRating(0);
                setMeetingsFrequency('');
                setExpertRating(0);
                setAvailableRating(0);
                setStartFeedback('');
                setStopFeedback('');
                setContinueFeedback('');
                setCurrentStep(1);
            };

            const startNewFeedback = () => {
                setIsFormSubmitted(false);
                setSelectedManagerId('');
            };

            const handleAddManager = (e) => {
                e.preventDefault();
                if (!newManagerName.trim() || !newManagerTeam.trim()) return;

                const newId = `mgr-${Date.now()}`;
                const newMgr = {
                    id: newId,
                    name: newManagerName.trim(),
                    team: newManagerTeam.trim()
                };

                setManagers([...managers, newMgr]);
                setDashboardManagerId(newId);
                setNewManagerName('');
                setNewManagerTeam('');
                setShowAddManagerModal(false);
            };

            // Real-time Analytic Calculations
            const managerStats = useMemo(() => {
                const currentMgr = managers.find(m => m.id === dashboardManagerId) || managers[0];
                const mgrFeedbacks = feedbacks.filter(f => f.managerId === currentMgr.id);

                if (mgrFeedbacks.length === 0) {
                    return {
                        manager: currentMgr,
                        totalFeedback: 0,
                        avgCoaching: 0,
                        avgMeetings: 0,
                        avgExpert: 0,
                        avgAvailable: 0,
                        overallScore: 0,
                        coachingFreqDistribution: {},
                        meetingsFreqDistribution: {},
                        comments: []
                    };
                }

                const total = mgrFeedbacks.length;
                let sumCoaching = 0, sumMeetings = 0, sumExpert = 0, sumAvailable = 0;
                const coachFreq = {};
                const meetFreq = {};

                mgrFeedbacks.forEach(f => {
                    sumCoaching += f.coachingRating;
                    sumMeetings += f.meetingsRating;
                    sumExpert += f.expertRating;
                    sumAvailable += f.availableRating;

                    coachFreq[f.coachingFrequency] = (coachFreq[f.coachingFrequency] || 0) + 1;
                    meetFreq[f.meetingsFrequency] = (meetFreq[f.meetingsFrequency] || 0) + 1;
                });

                const avgCoaching = parseFloat((sumCoaching / total).toFixed(1));
                const avgMeetings = parseFloat((sumMeetings / total).toFixed(1));
                const avgExpert = parseFloat((sumExpert / total).toFixed(1));
                const avgAvailable = parseFloat((sumAvailable / total).toFixed(1));
                const overallScore = parseFloat(((avgCoaching + avgMeetings + avgExpert + avgAvailable) / 4).toFixed(1));

                return {
                    manager: currentMgr,
                    totalFeedback: total,
                    avgCoaching,
                    avgMeetings,
                    avgExpert,
                    avgAvailable,
                    overallScore,
                    coachingFreqDistribution: coachFreq,
                    meetingsFreqDistribution: meetFreq,
                    comments: mgrFeedbacks.map(f => ({
                        timestamp: f.timestamp,
                        start: f.startFeedback,
                        stop: f.stopFeedback,
                        continue: f.continueFeedback
                    }))
                };
            }, [dashboardManagerId, feedbacks, managers]);

            const globalStats = useMemo(() => {
                return {
                    totalSubmissions: feedbacks.length,
                    managedCount: managers.length
                };
            }, [feedbacks, managers]);

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans">
                    
                    {/* ==========================================
                        HEADER BANNER & ROLE SELECTOR
                        ========================================== */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col sm:flex-row items-center justify-between py-4 space-y-4 sm:space-y-0">
                                
                                <div className="flex items-center space-x-3">
                                    <div className="p-2.5 bg-indigo-600 text-white rounded-xl shadow-md shadow-indigo-100">
                                        <Icon name="shield" className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h1 className="text-xl font-bold tracking-tight text-slate-950">Sales Leader 360°</h1>
                                        <p className="text-xs text-slate-500 font-medium">Safe, Anonymous Coaching & Leadership Analytics</p>
                                    </div>
                                </div>

                                <div className="hidden md:flex items-center space-x-4 bg-slate-100 px-4 py-1.5 rounded-full text-xs font-semibold text-slate-600">
                                    <span className="flex items-center space-x-1">
                                        <Icon name="users" className="w-3.5 h-3.5 text-indigo-500" />
                                        <span>{globalStats.managedCount} Leaders Rated</span>
                                    </span>
                                    <span className="w-1 h-1 bg-slate-300 rounded-full"></span>
                                    <span className="flex items-center space-x-1">
                                        <Icon name="messagesquare" className="w-3.5 h-3.5 text-emerald-500" />
                                        <span>{globalStats.totalSubmissions} Feedback Responses</span>
                                    </span>
                                </div>

                                <div className="flex bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                                    <button
                                        onClick={() => handleTabChange('agent')}
                                        className={`flex items-center space-x-2 px-4 py-2 text-sm font-semibold rounded-lg transition-all ${
                                            activeTab === 'agent'
                                                ? 'bg-white text-indigo-700 shadow-sm'
                                                : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
                                        }`}
                                    >
                                        <Icon name="lock" className="w-4 h-4 text-emerald-600" />
                                        <span>Submit Feedback (Agent)</span>
                                    </button>
                                    <button
                                        onClick={() => handleTabChange('dashboard')}
                                        className={`flex items-center space-x-2 px-4 py-2 text-sm font-semibold rounded-lg transition-all ${
                                            activeTab === 'dashboard'
                                                ? 'bg-indigo-600 text-white shadow-sm'
                                                : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'
                                        }`}
                                    >
                                        {isAdminAuthenticated ? (
                                            <Icon name="unlock" className="w-4 h-4 text-emerald-400" />
                                        ) : (
                                            <Icon name="lock" className="w-4 h-4 text-slate-400" />
                                        )}
                                        <span>Leaderboard & Analytics</span>
                                    </button>
                                </div>

                            </div>
                        </div>
                    </header>

                    {/* ==========================================
                        PASSCODE PROTECTION MODAL (ADMIN ACCESS)
                        ========================================== */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100 animate-scaleUp relative overflow-hidden">
                                <div className="absolute right-0 top-0 opacity-5 transform translate-x-1/6 -translate-y-1/6 text-slate-900">
                                    <Icon name="lock" className="w-48 h-48" />
                                </div>

                                <div className="relative z-10 text-center">
                                    <div className="inline-flex items-center justify-center p-3.5 bg-indigo-50 text-indigo-600 rounded-full mb-4 ring-8 ring-indigo-50/50">
                                        <Icon name="lock" className="w-6 h-6" />
                                    </div>
                                    
                                    <h3 className="text-xl font-bold text-slate-900">Leadership & Admin Verification</h3>
                                    <p className="text-xs text-slate-500 mt-1.5 px-4">
                                        The leaderboard and aggregate scores are secured to safeguard honesty and feedback objectivity.
                                    </p>

                                    <form onSubmit={handleAuthSubmit} className="mt-6 space-y-4">
                                        <div className="relative">
                                            <input
                                                type={showPasscodeText ? "text" : "password"}
                                                required
                                                autoFocus
                                                placeholder="Enter Admin Passcode"
                                                value={enteredPasscode}
                                                onChange={(e) => setEnteredPasscode(e.target.value)}
                                                className="w-full rounded-xl border border-slate-200 pl-4 pr-12 py-3 text-sm text-center font-semibold tracking-wider focus:ring-4 focus:ring-indigo-100 focus:border-indigo-600 focus:outline-hidden transition-all placeholder:tracking-normal placeholder:font-normal"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => setShowPasscodeText(!showPasscodeText)}
                                                className="absolute inset-y-0 right-0 px-4 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
                                            >
                                                {showPasscodeText ? <Icon name="eyeoff" className="w-4 h-4" /> : <Icon name="eye" className="w-4 h-4" />}
                                            </button>
                                        </div>

                                        {authError && (
                                            <div className="flex items-center justify-center space-x-1.5 p-2 bg-rose-50 border border-rose-100 rounded-xl text-rose-700 text-xs font-semibold animate-shake">
                                                <Icon name="alertcircle" className="w-4 h-4 shrink-0" />
                                                <span>{authError}</span>
                                            </div>
                                        )}

                                        <div className="flex space-x-2 pt-2">
                                            <button
                                                type="button"
                                                onClick={() => setShowAuthModal(false)}
                                                className="w-1/2 py-2.5 border border-slate-200 text-slate-600 rounded-xl text-xs font-bold hover:bg-slate-50 transition-colors"
                                            >
                                                Cancel
                                            </button>
                                            <button
                                                type="submit"
                                                className="w-1/2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-100 transition-all"
                                            >
                                                Verify Passcode
                                            </button>
                                        </div>
                                    </form>
